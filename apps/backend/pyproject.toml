[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-ai"
version = "0.1.0"
description = "Equipe de agentes de marketing do Studio AI"
requires-python = ">=3.11"
dependencies = ["openai-agents==0.22.1", "pydantic==2.13.5", "python-dotenv==1.2.3", "Pillow==12.1.0", "psycopg[binary,pool]==3.2.12", "redis==8.1.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
studio-ai-cli = "studio_ai.presentation.cli:main"
studio-ai = "studio_ai.presentation.http.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"studio_ai.infrastructure.identity" = ["schema.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
