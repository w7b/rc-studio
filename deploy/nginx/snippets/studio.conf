# The API accepts JSON with base64 uploads, up to 23 MiB per request. Per-file
# limits belong in the application; multiple Brand Kit logos must upload separately.
client_max_body_size 23m;
client_header_timeout 15s;
client_body_timeout 60s;
send_timeout 300s;
keepalive_timeout 30s;

error_page 413 = @upload_too_large;
location @upload_too_large {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 413 '{"error":"Upload excedeu o limite da requisição. Envie os arquivos separadamente."}';
}

location / {
    proxy_pass $studio_backend;
    proxy_http_version 1.1;
    # Preserve the public port as well as hostname: CSRF and OAuth use this origin.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    # Brief assistance is synchronous; campaign/image creation returns 202.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;
    # Never replay a request that may have started a paid generation.
    proxy_next_upstream off;
}
