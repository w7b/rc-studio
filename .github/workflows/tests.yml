name: Validate application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run format:check
        working-directory: apps/frontend
      - run: node --test apps/frontend/tests/*.test.js
      - run: npm run build
        working-directory: apps/frontend

  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: studio
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      # The Python suite checks the real JavaScript serializer against Pydantic.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e './apps/backend[dev]'
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:studio@127.0.0.1:5433/postgres

  container:
    name: Packaged app and NGINX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build --target runtime -t realcenter-studio:test .
      - run: docker run --rm --network none --mount type=bind,source=${{ github.workspace }}/scripts/smoke.py,target=/tmp/smoke.py,readonly realcenter-studio:test python /tmp/smoke.py
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml --profile shared config --quiet
      - run: docker compose -f compose.proxy-local.yaml config --quiet
      - run: docker pull nginx:stable-alpine
      - run: python scripts/smoke_nginx.py --image realcenter-studio:test --postgres

  # Keep one stable required check; path filters could leave PR checks pending.
  test:
    name: test
    if: always()
    needs: [frontend, backend, container]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation job
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          test "$FRONTEND" = success
          test "$BACKEND" = success
          test "$CONTAINER" = success
